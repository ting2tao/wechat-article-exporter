services:
  app:
    image: ghcr.io/ting2tao/wx-exporter:${IMAGE_TAG:-latest}
    container_name: wx-exporter
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NITRO_KV_DRIVER: fs
      NITRO_KV_BASE: .data/kv
      WORKER_SQLITE_PATH: .data/worker-scheduler.db
      WORKER_HTML_DIR: .data/worker-html
    ports:
      - '3000:3000'
    volumes:
      - ${DATA_DIR:-/root/wechat-data}:/app/.data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
